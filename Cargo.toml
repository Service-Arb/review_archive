[package]
name = "review_archive"
description = "Archive of public place reviews: a PNG of every review as it first appears, plus structured data for statistics"
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/Service-Arb/review_archive"
readme = "README.md"

[dependencies]
axum = "0.8"
chromiumoxide = { version = "0.9", default-features = false }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crc32fast = "1"
csv = "1"
eyre = "0.6"
futures = "0.3"
jiff = { version = "0.2", features = ["serde"] }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
png = "0.18"
tempfile = "3"

[lints.clippy]
float_cmp = "allow"
len_zero = "allow"

[lints.rust]
unused_features = "allow"
