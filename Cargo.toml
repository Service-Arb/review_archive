[workspace]
resolver = "3"
members = [
    "crates/review_archive",
    "crates/review_archive_client",
    "crates/review_archive_core",
    "crates/review_archive_server",
    "crates/review_archive_web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/Service-Arb/review_archive"
readme = "README.md"

[workspace.dependencies]
review_archive = { path = "crates/review_archive", version = "0.1.0", default-features = false }
review_archive_core = { path = "crates/review_archive_core", version = "0.1.0" }
review_archive_server = { path = "crates/review_archive_server", version = "0.1.0" }

axum = "0.8"
browser_manipulation = { git = "https://github.com/valeratrades/browser_manipulation", tag = "v0.2.1" }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
concierge_iam = "0.1.0"
crc32fast = "1"
csv = "1"
ev_lib = { version = "0.24.2", default-features = false }
eyre = "0.6"
futures = "0.3"
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "avif-native"] }
jiff = { version = "0.2", features = ["serde"] }
kamadak-exif = "0.6"
miette = "7"
rand = "0.10"
sa_auth = { git = "https://github.com/Service-Arb/panel", rev = "08ef71573c1c3eddaece8f5327cb3e76cbe7b761" }
ravif = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls"] }
schemars = "1"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
sha2 = "0.11"
smart-default = "0.7"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
strum = { version = "0.28", features = ["derive"] }
tg_types = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = "5"
v_utils = { version = "2.19", default-features = false, features = ["macros"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

ev_lib_classes = "0.13.1"
insta = { version = "1", features = ["yaml"] }
png = "0.18"
tempfile = "3"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
result_large_err = "allow" # typed errors carry their backtrace and span trace; each reports a failed network round-trip

[workspace.lints.rust]
unused_features = "allow"

# an unoptimised AV1 encoder takes minutes per capture
[profile.dev.package.rav1e]
opt-level = 3
