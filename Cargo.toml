[workspace]
resolver = "3"
members = [
    "crates/review_archive",
    "crates/review_archive_client",
    "crates/review_archive_core",
    "crates/review_archive_server",
    "crates/review_archive_web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/Service-Arb/review_archive"
readme = "README.md"

[workspace.dependencies]
review_archive = { path = "crates/review_archive", version = "0.1.0", default-features = false }
review_archive_core = { path = "crates/review_archive_core", version = "0.1.0" }
review_archive_server = { path = "crates/review_archive_server", version = "0.1.0" }

axum = "0.8"
base64 = "0.22"
chromiumoxide = { version = "0.9", default-features = false }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crc32fast = "1"
csv = "1"
ev_lib = { version = "0.22", default-features = false }
eyre = "0.6"
futures = "0.3"
hmac = "0.13"
jiff = { version = "0.2", features = ["serde"] }
miette = "7"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tg_types = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = "5"
v_utils = { version = "2.19", default-features = false, features = ["macros"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

insta = { version = "1", features = ["yaml"] }
png = "0.18"
tempfile = "3"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
result_large_err = "allow" # typed errors carry their backtrace and span trace; each reports a failed network round-trip

[workspace.lints.rust]
unused_features = "allow"
