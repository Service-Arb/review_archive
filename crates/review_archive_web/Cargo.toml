[package]
name = "review_archive_web"
description = "The review_archive dashboard: a microfrontend over the member API"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[package.metadata.cargo-machete]
ignored = ["getrandom"]

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7", default-features = false, features = ["launch", "logger", "lib", "web", "router"] } # no devtools: nothing serves its /_dioxus socket
dockviewers_dioxus = { version = "0.2.3", default-features = false, features = ["web"] }
ev_lib = { workspace = true, features = ["mfe", "uikit"] }
getrandom = { version = "0.3", features = ["wasm_js"] } # v_utils (via the core) hashes with ahash; the flake's RUSTFLAGS pick this backend
jiff.workspace = true
js-sys = "0.3"
reqwest = { version = "0.13", default-features = false }
review_archive_client = { path = "../review_archive_client" }
sa_auth.workspace = true
wasm-bindgen = "=0.2.129" # the flake's wasm-bindgen-cli is this version; a skew is a hard error
web-sys = { version = "0.3", features = ["DataTransfer", "DragEvent", "Element", "HtmlDocument", "Location", "Storage", "Window", "Document"] }

[build-dependencies]
ev_lib_classes = { workspace = true }

[lints]
workspace = true
