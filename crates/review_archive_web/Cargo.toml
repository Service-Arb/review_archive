[package]
name = "review_archive_web"
description = "The review_archive dashboard: a microfrontend over the member API"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7", features = ["web"] }
ev_lib = { workspace = true, features = ["mfe"] }
futures = { workspace = true }
jiff.workspace = true
js-sys = "0.3"
review_archive_client = { path = "../review_archive_client" }
wasm-bindgen = "=0.2.129" # the flake's wasm-bindgen-cli is this version; a skew is a hard error
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "DataTransfer", "DragEvent", "Element", "MutationObserver", "MutationObserverInit", "MutationRecord", "Storage", "Url", "Window", "Document"] }

[lints]
workspace = true
