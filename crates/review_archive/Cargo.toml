[package]
name = "review_archive"
description = "Archive of public place reviews: an AVIF screenshot of every review as it first appears, plus structured data for statistics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.cargo-machete]
ignored = ["tracing-error"]

[features]
default = ["maps", "store"]
# Google in a headless Chromium: the `Browser` handle, the `maps` source, and the `gbp`
# source (Business Profiles through the official API, screenshots from the Maps page).
maps = ["dep:browser_manipulation"]
# the config sections as v_utils `Settings` sections
settings = ["dep:clap", "dep:schemars", "v_utils/cli", "review_archive_core/settings"]
# SQLite + content-addressed AVIFs under a data dir, runs, stats, export, webhooks.
store = [
    "dep:futures",
    "dep:hmac",
    "dep:png",
    "dep:sqlx",
    "dep:tempfile",
    "dep:tg_types",
    "dep:zip",
]

[dependencies]
browser_manipulation = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
eyre.workspace = true
futures = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
image.workspace = true
jiff.workspace = true
kamadak-exif.workspace = true
miette.workspace = true
png = { workspace = true, optional = true }
ravif.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
review_archive_core.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smart-default.workspace = true
sqlx = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tg_types = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time", "rt", "macros", "net"] }
tracing.workspace = true
tracing-error.workspace = true
v_utils = { workspace = true, features = ["memory_lease"] } # tokio/net, which the wasm crates cannot build
zip = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
png.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
