[package]
name = "review_archive"
description = "Archive of public place reviews: a PNG of every review as it first appears, plus structured data for statistics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.cargo-machete]
ignored = ["tracing-error"]

[features]
default = ["maps", "store"]
# Google in a headless Chromium: the `Browser` handle, the `maps` source, and the `gbp`
# source (Business Profiles through the official API, screenshots from the Maps page).
maps = ["dep:chromiumoxide", "dep:futures"]
# SQLite + content-addressed PNGs under a data dir, runs, stats, export, webhooks.
store = ["dep:futures", "dep:hmac", "dep:sqlx", "dep:tempfile", "dep:tg_types", "dep:zip"]

[dependencies]

chromiumoxide = { workspace = true, optional = true }
crc32fast.workspace = true
ev_lib = { workspace = true, features = ["alerts"] }
eyre.workspace = true
futures = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
jiff.workspace = true
miette.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
review_archive_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tg_types = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "sync", "time", "rt", "macros", "net"] }
tracing.workspace = true
tracing-error.workspace = true
v_utils.workspace = true
zip = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
png.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
