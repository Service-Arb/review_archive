[package]
name = "review_archive_client"
description = "Typed async client for a running review_archive's HTTP API"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]

review_archive_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest.workspace = true

# the browser's fetch: no TLS stack of its own
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }

[dev-dependencies]
axum.workspace = true
eyre.workspace = true
jiff.workspace = true
review_archive = { workspace = true, features = ["maps", "store"] }
review_archive_server.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
zip.workspace = true

[lints]
workspace = true
