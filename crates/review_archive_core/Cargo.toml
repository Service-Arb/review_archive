[package]
name = "review_archive_core"
description = "review_archive without I/O: domain types, DTOs, reconciliation, the Google Maps review card parser and relative dates"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# `utoipa::ToSchema` on the DTOs, for the server's OpenAPI document.
openapi = ["dep:utoipa"]
# `Schedule` as a section of a v_utils `Settings` config
settings = ["dep:clap", "dep:schemars", "v_utils/cli"]

[dependencies]
clap = { workspace = true, optional = true }
csv.workspace = true
eyre.workspace = true
jiff.workspace = true
miette.workspace = true
schemars = { workspace = true, optional = true }
scraper.workspace = true
serde.workspace = true
serde_with.workspace = true
sha2.workspace = true
smart-default.workspace = true
strum.workspace = true
thiserror.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }
v_utils.workspace = true

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true

[lints]
workspace = true
